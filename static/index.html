<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Placement-Ready AI Career Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1220;
    --bg-elevated: #121B2E;
    --bg-card: #16213A;
    --border: #23304A;
    --teal: #2DD4BF;
    --gold: #F5B942;
    --text: #EDF1F7;
    --text-muted: #8A93A6;
    --danger: #EF7A6D;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    font-family:'Inter', sans-serif;
    color: var(--text);
    background-color: var(--bg);
    background-image:
      repeating-linear-gradient(115deg, rgba(45,212,191,0.045) 0px, rgba(45,212,191,0.045) 1px, transparent 1px, transparent 64px),
      repeating-linear-gradient(25deg, rgba(245,185,66,0.035) 0px, rgba(245,185,66,0.035) 1px, transparent 1px, transparent 96px),
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(45,212,191,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(245,185,66,0.08), transparent 55%);
    min-height: 100vh;
  }

  .wrap{ max-width: 900px; margin: 0 auto; padding: 64px 24px 96px; position: relative; }

  /* Signature element: an ascending "readiness" path watermark behind the hero */
  .hero{ position: relative; padding-bottom: 40px; overflow: visible; }
  .hero svg.path{
    position:absolute; right:-40px; top:-20px; width: 380px; height: 220px;
    opacity: 0.5; pointer-events:none;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--teal); margin: 0 0 14px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight: 700; font-size: clamp(32px, 5vw, 46px); line-height: 1.1;
    margin: 0 0 14px; max-width: 620px;
  }
  .sub{ color: var(--text-muted); font-size: 16px; max-width: 520px; line-height: 1.55; margin: 0; }

  form{
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-top: 40px;
    display: grid;
    gap: 18px;
  }
  .field label{
    display:block; font-family:'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase;
  }
  .field input, .field textarea{
    width: 100%; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; color: var(--text); font-family: 'Inter', sans-serif;
    font-size: 14px; resize: vertical;
  }
  .field input:focus, .field textarea:focus{
    outline: none; border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(45,212,191,0.15);
  }
  .field textarea{ min-height: 160px; line-height: 1.5; }
  .row{ display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }

  .dropzone{
    border: 1px dashed var(--border); border-radius: 8px; background: var(--bg-card);
    padding: 22px 16px; text-align: center; cursor: pointer; transition: border-color 0.12s ease, background 0.12s ease;
  }
  .dropzone:hover, .dropzone.dragover{ border-color: var(--teal); background: rgba(45,212,191,0.06); }
  .dropzone input[type="file"]{ display:none; }
  .dropzone .hint{ font-size: 13px; color: var(--text-muted); }
  .dropzone .hint strong{ color: var(--teal); font-weight: 600; }
  .dropzone .filename{
    display:none; align-items:center; justify-content:center; gap: 8px;
    font-family:'JetBrains Mono', monospace; font-size: 13px; color: var(--text);
  }
  .dropzone .filename .remove{
    color: var(--danger); cursor: pointer; font-family:'Inter', sans-serif; font-weight: 600;
  }
  @media (max-width: 640px){ .row{ grid-template-columns: 1fr; } }

  button{
    justify-self: start;
    background: var(--teal); color: #062024; border: none;
    font-family:'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px;
    padding: 13px 26px; border-radius: 8px; cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  button:hover{ background:#3EE6D0; }
  button:active{ transform: scale(0.98); }
  button:disabled{ background: var(--border); color: var(--text-muted); cursor: not-allowed; }

  .status{ font-family:'JetBrains Mono', monospace; font-size: 13px; color: var(--text-muted); margin-top: 10px; min-height: 18px; }
  .status.error{ color: var(--danger); }

  #report{ margin-top: 44px; display: none; }
  #report.visible{ display:block; }

  .section-card{
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 16px;
  }
  .section-card h2{
    font-family:'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600;
    color: var(--gold); margin: 0 0 14px; display:flex; align-items:center; gap: 10px;
  }
  .section-card h2 .num{
    font-family:'JetBrains Mono', monospace; font-size: 12px; color: var(--bg);
    background: var(--gold); width: 22px; height: 22px; border-radius: 6px;
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .section-card ul{ margin: 0; padding-left: 20px; }
  .section-card li{ margin-bottom: 8px; line-height: 1.5; color: var(--text); font-size: 14.5px; }
  .section-card li:last-child{ margin-bottom: 0; }
  .section-card li ul{ margin-top: 6px; }
  .section-card li li{ color: var(--text-muted); font-size: 13.5px; }

  footer{ margin-top: 56px; color: var(--text-muted); font-size: 12px; font-family:'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <svg class="path" viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg">
      <polyline points="10,200 70,160 70,200 140,120 140,200 210,90 210,200 280,50 280,200 350,20"
        fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="350" cy="20" r="5" fill="#F5B942"/>
    </svg>
    <p class="eyebrow">Placement Ready / AI Career Agent</p>
    <h1>Find out exactly what's between you and your first offer.</h1>
    <p class="sub">Drop in your resume, target role, and GitHub handle. The agent checks live job openings, spots your skill gaps, and hands you a readiness report.</p>
  </div>

  <form id="career-form">
    <div class="field">
      <label for="role">Desired role</label>
      <input id="role" name="role" type="text" placeholder="e.g. Machine Learning Engineer" required />
    </div>
    <div class="field">
      <label for="github">GitHub username</label>
      <input id="github" name="github" type="text" placeholder="e.g. octocat" required />
    </div>
    <div class="field">
      <label for="resume-input">Resume file</label>
      <label class="dropzone" id="dropzone" for="resume-input">
        <input id="resume-input" name="resume" type="file" accept=".pdf,.doc,.docx,.txt" required />
        <div class="hint" id="dropzone-hint"><strong>Click to upload</strong> or drag and drop &mdash; PDF, DOCX, or TXT</div>
        <div class="filename" id="dropzone-filename">
          <span id="dropzone-filename-text"></span>
          <span class="remove" id="dropzone-remove">Remove</span>
        </div>
      </label>
    </div>
    <button type="submit" id="submit-btn">Run career check</button>
    <div class="status" id="status"></div>
  </form>

  <div id="report"></div>

  <footer>placement-ready-ai-career-agent</footer>
</div>

<script>
const form = document.getElementById('career-form');
const statusEl = document.getElementById('status');
const reportEl = document.getElementById('report');
const submitBtn = document.getElementById('submit-btn');

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Parses the agent's bullet-point report text into styled section cards.
// Expects lines like "1. DESIRED ROLE" as headings and "- item" as bullets,
// with two-space-indented "  - item" as nested bullets.
function renderReport(text){
  reportEl.innerHTML = '';
  reportEl.classList.add('visible');

  const lines = text.split('\n').map(l => l.replace(/\r$/, ''));
  let currentSection = null;
  let currentList = null;
  let nestedList = null;

  const sections = [];

  for (const raw of lines){
    const line = raw.trim();
    if (!line) continue;

    const headingMatch = line.match(/^(\d+)\.\s+(.*)$/);
    const nestedMatch = raw.match(/^\s{2,}-\s+(.*)$/);
    const bulletMatch = !nestedMatch && line.match(/^-\s+(.*)$/);

    if (headingMatch){
      currentSection = { num: headingMatch[1], title: headingMatch[2], items: [] };
      sections.push(currentSection);
      nestedList = null;
      continue;
    }

    if (!currentSection){
      // Title line or preamble before first numbered section — skip.
      continue;
    }

    if (nestedMatch){
      if (currentSection.items.length === 0){
        currentSection.items.push({ text: '', children: [] });
      }
      const last = currentSection.items[currentSection.items.length - 1];
      last.children.push(nestedMatch[1]);
    } else if (bulletMatch){
      currentSection.items.push({ text: bulletMatch[1], children: [] });
    } else {
      // Fallback: treat any stray non-bullet line as its own bullet
      currentSection.items.push({ text: line, children: [] });
    }
  }

  if (sections.length === 0){
    // Model didn't follow the format — show raw text as a fallback.
    const card = document.createElement('div');
    card.className = 'section-card';
    card.innerHTML = `<pre style="white-space:pre-wrap;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-muted);margin:0;">${escapeHtml(text)}</pre>`;
    reportEl.appendChild(card);
    return;
  }

  for (const section of sections){
    const card = document.createElement('div');
    card.className = 'section-card';
    const itemsHtml = section.items.map(item => {
      const childrenHtml = item.children.length
        ? `<ul>${item.children.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>`
        : '';
      const mainText = item.text ? `<span>${escapeHtml(item.text)}</span>` : '';
      return `<li>${mainText}${childrenHtml}</li>`;
    }).join('');
    card.innerHTML = `<h2><span class="num">${section.num}</span>${escapeHtml(section.title)}</h2><ul>${itemsHtml}</ul>`;
    reportEl.appendChild(card);
  }
}

// --- Resume dropzone: click-to-upload + drag-and-drop ---
const dropzone = document.getElementById('dropzone');
const resumeInput = document.getElementById('resume-input');
const dropzoneHint = document.getElementById('dropzone-hint');
const dropzoneFilename = document.getElementById('dropzone-filename');
const dropzoneFilenameText = document.getElementById('dropzone-filename-text');
const dropzoneRemove = document.getElementById('dropzone-remove');

function showSelectedFile(file){
  if (!file){
    dropzoneHint.style.display = 'block';
    dropzoneFilename.style.display = 'none';
    return;
  }
  dropzoneHint.style.display = 'none';
  dropzoneFilename.style.display = 'flex';
  dropzoneFilenameText.textContent = file.name;
}

resumeInput.addEventListener('change', () => {
  showSelectedFile(resumeInput.files[0] || null);
});

dropzoneRemove.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  resumeInput.value = '';
  showSelectedFile(null);
});

['dragenter', 'dragover'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
  });
});
dropzone.addEventListener('drop', (e) => {
  const file = e.dataTransfer.files[0];
  if (file){
    resumeInput.files = e.dataTransfer.files;
    showSelectedFile(file);
  }
});

// --- Form submit: multipart upload to /run-agent ---
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const role = document.getElementById('role').value.trim();
  const github = document.getElementById('github').value.trim();
  const resumeFile = resumeInput.files[0];

  if (!resumeFile){
    statusEl.classList.add('error');
    statusEl.textContent = 'Please attach a resume file first.';
    return;
  }

  const formData = new FormData();
  formData.append('resume', resumeFile);
  formData.append('desired_role', role);
  formData.append('github_username', github);

  submitBtn.disabled = true;
  statusEl.classList.remove('error');
  statusEl.textContent = 'Reading resume, running job search, skill-gap analysis, project ideas, and GitHub check…';
  reportEl.classList.remove('visible');
  reportEl.innerHTML = '';

  try {
    const res = await fetch('/run-agent', {
      method: 'POST',
      body: formData
    });

    const data = await res.json();

    if (!res.ok){
      throw new Error(data.error || `Server returned ${res.status}`);
    }

    const finalReport = data.final_report || JSON.stringify(data, null, 2);

    statusEl.textContent = 'Done.';
    renderReport(finalReport);
  } catch (err) {
    statusEl.classList.add('error');
    statusEl.textContent = `Something went wrong: ${err.message}`;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
